interface:
  display_name: video-editor-1.6
  short_description: 固定模板复现同款效果，内置字体与校验，智能编排素材和单行重点字幕
  default_prompt: 使用 $video-editor-v1-6 剪辑我的视频：先运行scripts/run.py --check并报告版本与package_fingerprint；仅使用内置程序，失败停止；正式交付前必须通过scripts/finalize.py审核，禁止将候选成片当正式结果；先给3个候选标题供我选择或采用我自定标题；首帧原视频封面，标题恰好两行每行最多4字、无标点、居中艺术字；圆窗无留白，head_box必须覆盖全部头发与脸及下巴并通过几何检查；每段换模板，画板2.4秒内容动效且连续静止不得超过3秒，通过5fps内容区审查；左上段落概述、右上无序号；默认使用wenfeng-standard-v1和scripts/run.py，先理解口播和辅助素材，再选择固定模板并填写实际时间，不自行改写样式，每次只显示一行字幕，并突出关键词。
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
