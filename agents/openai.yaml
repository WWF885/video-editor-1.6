  short_description: 固定模板复现同款效果，内置字体与校验，智能编排素材和单行重点字幕
  default_prompt: 使用 $wwf-video-editor 剪辑我的视频：先给3个候选标题供我选择或采用我自定标题；首帧原视频加艺术字；头像保留头发和肩膀；每段换模板；左上段落概述、右上无序号；默认使用wenfeng-standard-v1和scripts/run.py，先理解口播和辅助素材，再选择固定模板并填写实际时间，不自行改写样式，每次只显示一行字幕，并突出关键词。
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
